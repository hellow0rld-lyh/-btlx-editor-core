[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btlx-editor-core"
version = "0.1.0a1"
description = "Neutral lossless protobuf wire and descriptor-injected structural editing core"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
authors = [{name = "BTLX Core contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Libraries :: Python Modules"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["btlx_core"]
